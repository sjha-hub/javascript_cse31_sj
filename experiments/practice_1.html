<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    
    <style>
        /* Page Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        /* Form Container */
        form {
            background-color: white;
            width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        /* Heading */
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        /* Labels */
        label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
            color: #444;
        }

        /* Text, Email, Date and File Inputs */
        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="file"],
        select,
        textarea {
            width: 380px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        /* Focus Effect */
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }

        /* Radio Buttons */
        input[type="radio"] {
            margin-left: 5px;
        }

        /* Radio and Checkbox Labels */
        input[type="radio"] + label {
            width: auto;
            font-weight: normal;
            margin-right: 15px;
        }

        /* Checkboxes */
        input[type="checkbox"] {
            margin: 5px;
        }

        /* Textarea */
        textarea {
            height: 80px;
            resize: vertical;
            vertical-align: top;
        }

        /* Submit Button */
        input[type="submit"] {
            display: block;
            margin: 25px auto 0;
            padding: 12px 35px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        /* Button Hover Effect */
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <form>
        <h1>Student Registration Form</h1>

        <label>First Name:</label>
        <input type="text" required>
        <br><br>

        <label>Last Name:</label>
        <input type="text" required>
        <br><br>

        <label>Father's Name:</label>
        <input type="text" required>
        <br><br>

        <label>Mother's Name:</label>
        <input type="text" required>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" required>
        <br><br>

        <label>Email:</label>
        <input type="email" required>
        <br><br>

        <label for="gender">Gender:</label>
        <input type="radio" name="gender" value="male" required>
        <label for="male">Male</label>
        <input type="radio" name="gender" value="female" required>
        <label for="female">Female</label>
        <br><br>

        <label for="course">Choose Course:</label>
        <select id="course" required>
            <option value="">Select a course</option>
            <option value="btech">B.Tech</option>
            <option value="mtech">M.Tech</option>
            <option value="mba">MBA</option>
            <option value="mca">MCA</option>
            <option value="bca">BCA</option>
        </select>
        <br><br>

        <label>Hobbies:</label>
        <input type="checkbox" name="hobby1" value="singing">Singing
        <input type="checkbox" name="hobby2" value="dancing">Dancing
        <input type="checkbox" name="hobby3" value="reading">Reading books
        <input type="checkbox" name="hobby4" value="cricket">Playing cricket
        <br><br>

        <label for="address">Address:</label>
        <textarea id="address" required></textarea>
        <br><br>

        <label>Photo:</label>
        <input type="file" accept="image/*" required>
        <br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
